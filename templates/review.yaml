# quorum 配置骨架。路径语义：配置里声明的相对路径按**本文件所在目录**解析。
#
# quorum **不自带任何模型，也不自带任何 harness**。下面每个值都是你的选择：
#
#   vendor  —— 模型来源（谁训的权重）。**声明**字段：工具验证不了真假，它只用来判断
#              「这两个审核员是不是同源」——同源模型看不出同源的盲区。
#              同一 vendor 不能有两个 primary。
#   harness —— agent 框架（哪个 CLI 在跑它）。**事实**字段：从 channel 推出，不用你声明。
#              两个轴都跨，一致性才等于「两个独立来源互相印证」。
#
# 接哪家模型、哪个 CLI 都行 —— 内置的起法只是**机制示例**，不是全部选项：
#   kind: claude-cli   任何 Anthropic 兼容端点（换厂商只改 env，不动代码）
#   kind: codex-cli    本机 codex CLI（**只认 responses 协议**）
#   kind: opencode-cli 本机 opencode CLI（自带协议适配，只给 chat/completions 的端点也能接）
#                       ⚠️ 它的 `OPENCODE_CONFIG_CONTENT` 里**必须**有 `permission`，
#                       否则 quorum 拒绝启动——opencode 默认把 `external_directory` 设成
#                       "ask"，而 headless 跑没人能批，审核员会**静默卡死**（退出码还是 0）。
#                       最小可用的一组见 CONTRACT.md，或 quorum/channels.py 的 _OPENCODE_PERM_HELP
#   kind: exec         任何别的 CLI（自己写 argv）
#
# ⚠️ 起审核员之前先跑一次 `quorum preflight --config 本文件 --all`。它问两个问题：
#    ① 凭据对照 —— 用一条**故意错的凭据**反证「请求真的经过了这里声明的那个端点」。
#       不做这一步，通道凭据没生效时你拿到的是一份**来源标签是错的**结论，而那在
#       后续任何环节都看不出来——真发生过，连着四轮。注意：**用户级配置会盖过进程环境变量**
#       （claude-cli 是用户级 settings；opencode 是 $XDG_DATA_HOME 下的 auth.json），
#       所以「我设了环境变量」从来不等于「通道会用它」，这是默认行为不是意外。
#    ② 模型身份 —— 读应答里带的模型名，抓**别名映射**（声明 `X-pro` 而端点回 `X` 这类降级）。
#
# 真实的多厂商配置见 examples/ —— 那也只是例子，照抄要改成你自己的。

project: my-project
repo: .                       # 项目根（审核员的工作目录）
brief: reviews/brief.md       # 工单：自包含，审核员没有前轮记忆
out_dir: reviews/out
ledger: reviews/dispose.md    # 处置台账（verify 读它）
sources: ["src", "data", "reports"]   # 材料快照指纹覆盖这些路径
snapshot_exclude: ["reviews/out", "node_modules", ".venv"]

channels:
  # ① 任何 Anthropic 兼容端点
  endpoint:
    kind: claude-cli
    model: <该端点支持的模型名>
    # args: 额外命令行标志。**审核员跑不了代码 = 最强的一类发现拿不到**
    # （真实事故：三家审核员里两家被权限白名单挡住，可执行验证全没拿到）。
    # 放行本地只读命令（白名单之外的工具在 -p 模式下直接拒绝，不是弹窗询问）：
    # args: ["--allowedTools", "Bash(python3:*),Bash(git log:*),Bash(git show:*),"
    #                          "Bash(grep:*),Bash(ls:*),Bash(wc:*),Read,Grep,Glob"]
    env:
      ANTHROPIC_BASE_URL: https://<你的端点>
      ANTHROPIC_AUTH_TOKEN_FILE: ~/.config/<你的密钥文件>   # 只给路径，内容不进配置/命令行
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: "32000"
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "262144"

  # ② 本机 codex CLI
  codex:
    kind: codex-cli

  # ③ 任何别的 CLI —— 「harness 可自定义」的入口就在这一条。
  #    占位符 {prompt} 必给；{repo} 会换成审核员的工作目录；
  #    argv 里出现 {out} 即表示该 CLI 自己写结论文件（quorum 就不重定向它的 stdout）。
  #
  #    ⚠️ 用 exec 时**必须**写 harness：exec 是通用起法，不写的话两个完全不同的
  #       CLI 都会被记成 "exec"，两个 harness 被塌成一个。
  #    ⚠️ 反过来，**不要**用它把同一个 loop 改名 —— 仅仅换个 BASE_URL 不构成
  #       另一个 harness，那只是把 plate 的「同 harness」注记骗掉，独立性一点没多。
  any-cli:
    kind: exec
    harness: my-agent            # 必填（用 exec 时）；别的 kind 可省略，默认取 kind
    argv: ["my-agent", "--read-only", "-C", "{repo}", "-p", "{prompt}"]

reviewers:
  # role: primary = 结论计入置信度；role: cross = 只作交叉参考，不计入。
  # 同一 vendor 最多只能有一个 primary。
  - {name: reviewer-a, channel: endpoint, vendor: <模型来源A>, role: primary}
  - {name: reviewer-b, channel: any-cli,  vendor: <模型来源B>, role: primary}
  - {name: reviewer-c, channel: codex,    vendor: <模型来源C>, role: cross}

gates:
  min_bytes: 2000
  min_findings: 5               # 数的是**解析出来的发现条数**，不是 emoji 出现次数
  require_sections: ["最脆弱"]
