name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      # 全部测试走 fake 通道 —— 不需要任何 API key
      - run: pytest -q
      # 公开仓必须通过自己的泄漏门禁（否则 pre-commit 也白搭）
      - run: quorum check-leaks .
      # 处置台账里的断言必须真的能跑。
      # 这条是补上的：台账曾经自己烂掉过一次 —— 第 3 行指向一个已被改名的测试，
      # 而 status 还写着 ✅。当时只有人工跑 verify 才发现。台账越厚，这个缺口越大。
      #
      # `--no-incidents`：CI 上写的「台账说谎记录」没人会看，而且会弄脏工作区。
      # 那份档案的读者是**本地跑的人**，所以只在本地写。
      - run: quorum verify --config reviews/review.yaml --no-incidents
