# quorum 审自己 —— 第一次跑真通道。
project: quorum
repo: ..
brief: brief.md
out_dir: out
ledger: dispose.md          # 相对本文件 → reviews/dispose.md
sources: ["quorum", "tests", "demo", "docs", "templates", "CONTRACT.md", "README.md"]
snapshot_exclude: ["reviews/out", ".venv", "__pycache__"]

channels:
  ark:                                  # 任何 Anthropic 兼容端点都能接
    kind: claude-cli
    model: kimi-k2.7-code
    env:
      ANTHROPIC_BASE_URL: https://ark.cn-beijing.volces.com/api/coding
      ANTHROPIC_AUTH_TOKEN_FILE: ~/.config/ark_key
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: "32000"
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "262144"
  dashscope:
    kind: claude-cli
    model: qwen3.8-flash
    env:
      ANTHROPIC_BASE_URL: https://dashscope.aliyuncs.com/apps/anthropic
      ANTHROPIC_AUTH_TOKEN: ${QWEN_API_KEY}
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "262144"
  codex:
    kind: codex-cli

reviewers:
  # vendor 决定 COI：同一 vendor 不得有两个 primary（同源模型看不出同源盲区）
  #
  # ⚠️ 看这两个轴：kimi 与 qwen 的 **vendor 不同，但 harness 相同**（都走 claude-cli）。
  # 它们的共识可能来自 Claude Code 这套 loop（同一 system prompt、同一工具、同一种套路），
  # 而不只是来自两个独立模型。codex 才是另一个 harness。
  # 旧版只记 vendor，plate 会打出「跨模型族一致 · 高置信」，读者容易以为买到了两维独立。
  - {name: kimi,  channel: ark,       vendor: moonshot, role: primary, timeout_s: 2400}
  - {name: qwen,  channel: dashscope, vendor: qwen,     role: primary, timeout_s: 2400, label: "第一轮就用过的审核员"}
  - {name: codex, channel: codex,     vendor: deepseek, role: cross,   timeout_s: 2400}

gates: {min_bytes: 2000, min_findings: 5, require_sections: ["最脆弱"]}
