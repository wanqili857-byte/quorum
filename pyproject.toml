[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum-review"
version = "0.1.0"
description = "多模型交叉审计：独立进程 · 冻结工单 · 交叉表 · 可执行断言"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
quorum = "quorum.cli:main"

[tool.setuptools]
packages = ["quorum"]
